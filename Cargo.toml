[package]
name = "crownlauncher"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A Raycast-style launcher for CrownOS: a glass search window that crownplugins extend"
license = "MIT"
repository = "https://github.com/crown-os/crownlauncher"

[dependencies]
crownui = { git = "https://github.com/crown-os/crownui", default-features = false, features = ["wayland", "impeller", "static", "tokio"] }
motion = { git = "https://github.com/crown-os/crownui" }
crownos-ipc = { git = "https://github.com/crown-os/crownos-ipc", features = ["tokio"] }
crownplugin-proto = { git = "https://github.com/crown-os/crownos-plugins" }
crownplugin-view = { git = "https://github.com/crown-os/crownos-plugins", features = ["icons"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

freedesktop_entry_parser = "1.3"
freedesktop-icons = "0.4"
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
crowntest = { git = "https://github.com/crown-os/crownui" }
impeller = { git = "https://github.com/crown-os/crownui", features = ["static"] }
runtime = { git = "https://github.com/crown-os/crownui" }
taffy-layout = { git = "https://github.com/crown-os/crownui" }
view = { git = "https://github.com/crown-os/crownui" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Local checkouts of the CrownOS repositories, cloned flat beside this one,
# stand in for their GitHub sources.
[patch."https://github.com/crown-os/crownui"]
crownui = { path = "../crownui/crownui" }
motion = { path = "../crownui/motion" }
crowntest = { path = "../crownui/crowntest" }
impeller = { path = "../crownui/impeller" }
runtime = { path = "../crownui/runtime" }
taffy-layout = { path = "../crownui/taffy-layout" }
view = { path = "../crownui/view" }

[patch."https://github.com/crown-os/crownos-plugins"]
crownplugin-proto = { path = "../crownos-plugins/proto" }
crownplugin-view = { path = "../crownos-plugins/view" }

[patch."https://github.com/crown-os/crownos-ipc"]
crownos-ipc = { path = "../crownos-ipc" }

[patch."https://github.com/crown-os/crownos-config"]
crownos-config = { path = "../crownos-config" }
